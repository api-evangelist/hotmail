aid: hotmail
name: Hotmail
description: >-
  Hotmail was one of the first free web-based email services, launched in 1996 by
  Sabeer Bhatia and Jack Smith and among the earliest venture-backed consumer web
  companies (funded by Draper Fisher Jurvetson and Menlo Ventures). Microsoft acquired
  Hotmail in December 1997 and operated it as MSN Hotmail and later Windows Live
  Hotmail. In 2013 Microsoft folded Hotmail into Outlook.com; hotmail.com mailboxes
  remain fully active but are served by Outlook.com and Microsoft 365 infrastructure.
  Hotmail exists today only as a legacy consumer email brand and domain, with no
  standalone developer program. Programmatic access to hotmail.com mailboxes is
  provided through Microsoft Graph (Outlook Mail) and the standard IMAP, POP, and
  SMTP protocols, not a dedicated Hotmail API.
